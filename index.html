<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <h1>YOU VS MACHINE- WONDER WHO WINS!</h1>
    <img class="human-choice rock" src="img/Rock.jpg" alt="Rock" height="200px"></img>
    <img class="human-choice paper" src="img/Paper.jpg" alt="Paper" height="200px"></img>
    <img class="human-choice scissors" src="img/Scissors.jpg" alt="Scissors" height="200px"></img>
    <div class="score-board">
        <p class="result-display"></p>
        <p>Your Score: <span class="human-score"></span></p>
        <p>Computer Score: <span class="computer-score"></span></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
